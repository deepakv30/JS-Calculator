name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Unit tests
        run: node test/evaluate.test.js

      - name: Static sanity
        run: |
          test -f index.html
          test -f script.js
          test -f style.css
          test -f evaluate.js
          grep -q evaluate script.js
