<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="A basic four-function JavaScript calculator demo with safe expression evaluation (add, subtract, multiply, divide, modulo).">
    <link rel="stylesheet" href="style.css">
    <title>JS Calculator — Basic four-function calculator</title>
</head>
<body>
    <div id="container">
        <header>Basic Calculator</header>
        <div id="calculator">
            <div id="result" role="status" aria-live="polite" aria-atomic="true" aria-label="Calculator display">
                <div id="history">
                    <div id="history-value"></div>
                </div>
                <div id="output">
                    <div id="output-value">100</div>
                </div>
            </div>
            <div id="keyboard">
                <button type="button" class="operator" id="clear" aria-label="Clear">C</button>
                <button type="button" class="operator" id="backspace" aria-label="Backspace">CE</button>
                <button type="button" class="operator" id="%" aria-label="Percent modulo">%</button>
                <button type="button" class="operator" id="/" aria-label="Divide">&#247;</button>
                <button type="button" class="number" id="7">7</button>
                <button type="button" class="number" id="8">8</button>
                <button type="button" class="number" id="9">9</button>
                <button type="button" class="operator" id="*" aria-label="Multiply">&times;</button>
                <button type="button" class="number" id="4">4</button>
                <button type="button" class="number" id="5">5</button>
                <button type="button" class="number" id="6">6</button>
                <button type="button" class="operator" id="-" aria-label="Subtract">-</button>
                <button type="button" class="number" id="1">1</button>
                <button type="button" class="number" id="2">2</button>
                <button type="button" class="number" id="3">3</button>
                <button type="button" class="operator" id="+" aria-label="Add">+</button>
                <button type="button" class="empty" disabled aria-hidden="true"></button>
                <button type="button" class="number" id="0">0</button>
                <button type="button" class="empty" disabled aria-hidden="true"></button>
                <button type="button" class="operator" id="=" aria-label="Equals">=</button>
            </div>
        </div>
    </div>
    <script src="evaluate.js"></script>
    <script src="script.js"></script>
</body>
</html>
